name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: user-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: user-service/go.mod
          cache-dependency-path: user-service/go.sum

      - name: Sync and verify modules
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run Tests
        run: go test ./...

      - name: Build
        run: go build -o user-service .git commit -m "Fix go.mod direct deps and Docker build for CI"

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: user-service
          skip-cache: true

      - name: Build Docker Image
        run: docker build -t user-service .
