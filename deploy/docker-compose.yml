services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ../product-service
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: product_db
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  user-service:
    build: ../user-service
    environment:
      PORT: "8082"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_db
      DB_PORT: "5432"
      JWT_SECRET: dev-secret-change-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  cart-service:
    build: ../cart-service
    environment:
      PORT: "8083"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cart_db
      DB_PORT: "5432"
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      product-service:
        condition: service_started
    ports:
      - "8083:8083"

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["/bin/sh", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build: ../api-gateway
    environment:
      PORT: "8080"
      PRODUCT_SERVICE_URL: http://product-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      - product-service
      - user-service
      - cart-service
    ports:
      - "8080:8080"

volumes:
  postgres_data:
