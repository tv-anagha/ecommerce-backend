services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ../product-service
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: product_db
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  user-service:
    build: ../user-service
    environment:
      PORT: "8082"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_db
      DB_PORT: "5432"
      JWT_SECRET: dev-secret-change-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  cart-service:
    build: ../cart-service
    environment:
      PORT: "8083"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cart_db
      DB_PORT: "5432"
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      product-service:
        condition: service_started
    ports:
      - "8083:8083"

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["/bin/sh", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  order-service:
    build: ../order-service
    environment:
      PORT: "8084"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_db
      DB_PORT: "5432"
      CART_SERVICE_URL: http://cart-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8081
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order.placed
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      cart-service:
        condition: service_started
      product-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8084:8084"

  notification-service:
    build: ../notification-service
    environment:
      PORT: "8085"
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order.placed
      KAFKA_GROUP_ID: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
    ports:
      - "8085:8085"

  fulfillment-service:
    build: ../fulfillment-service
    environment:
      PORT: "8086"
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order.placed
      KAFKA_GROUP_ID: fulfillment-service
    depends_on:
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
    ports:
      - "8086:8086"

  analytics-service:
    build: ../analytics-service
    environment:
      PORT: "8087"
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order.placed
      KAFKA_GROUP_ID: analytics-service
    depends_on:
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
    ports:
      - "8087:8087"

  api-gateway:
    build: ../api-gateway
    environment:
      PORT: "8080"
      PRODUCT_SERVICE_URL: http://product-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      - product-service
      - user-service
      - cart-service
      - order-service
    ports:
      - "8080:8080"

volumes:
  postgres_data:
